# Salin ke target.yaml lalu sesuaikan. target.yaml di-gitignore.
product_url: "https://shopee.co.id/..."
variant: "128GB Hitam"        # opsional, pilih by teks
start_time: "2026-10-10T00:00:00+07:00"
payment: "ShopeePay"
# Pengaman harga (WAJIB). Alat berhenti (PRICE_GUARD) bila harga/total melewati batas ini.
max_item_price: 1500000       # harga flash maksimum per unit (Rupiah)
max_total: 1550000            # total pembayaran maks, termasuk ongkir & biaya layanan
expected_name: "Ponsel"       # potongan nama produk (tidak peka huruf besar/kecil); WAJIB untuk --live
lead_ms: 150                  # opsional, bisa di-override --lead-ms
web:
  enabled: true
  profile_dir: "C:/flashbuy/chrome-profile"   # profil terpisah, login manual sekali
  channel: "chrome"           # Chrome terpasang; null = Chromium bawaan Playwright
  block_media: false          # true = blokir gambar/video/font agar lebih cepat
android:
  enabled: true
  serial: ""                  # kosong = device pertama
  package: "com.shopee.id"
  reload: "swipe"             # reload produk saat polling: "swipe" (tarik ke bawah) | "intent" (buka ulang URL)
notify_webhook: ""            # opsional
